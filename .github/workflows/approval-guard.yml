# Required check: the person who clicked Deploy cannot approve their own change.
# The Agent Builder App authors every PR, so GitHub's own "authors can't approve" rule
# does not cover the requester. This check does. It reads the requester from the last
# Requested-by-GitHub trailer on the head commit, which only the App can push
# (builder-branches ruleset), and passes once someone else has approved.
name: approval-guard
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  approval-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const { data: commit } = await github.rest.git.getCommit({
              owner, repo, commit_sha: pr.head.sha,
            });
            const trailers = [...commit.message.matchAll(/^Requested-by-GitHub: ([A-Za-z0-9-]+)$/gm)];
            const requester = trailers.length ? trailers[trailers.length - 1][1].toLowerCase() : null;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number,
            });
            const latest = new Map();
            for (const r of reviews) {
              if (["APPROVED", "CHANGES_REQUESTED", "DISMISSED"].includes(r.state)) {
                latest.set(r.user.login.toLowerCase(), r.state);
              }
            }
            const approvers = [...latest].filter(([, s]) => s === "APPROVED").map(([u]) => u);
            const independent = approvers.filter((u) => u !== requester);

            if (!requester) {
              core.setFailed("The head commit has no Requested-by-GitHub trailer, so the requester is unknown.");
            } else if (independent.length === 0) {
              core.setFailed(`Waiting for approval from someone other than @${requester}.`);
            } else {
              core.info(`Approved by ${independent.join(", ")} (requester: ${requester}).`);
            }
