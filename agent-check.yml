# Required check on every PR into dev. The image build runs `agent-builder check` and
# `agent-builder test`, so an invalid agent.yaml fails here.
# Pin third-party actions to a full commit SHA before use (the tags below are placeholders).
name: agent-check
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
  packages: read
jobs:
  agent-check:
    runs-on: ubuntu-latest
    env:
      # Pin by digest. Update when the platform team releases a new runtime.
      RUNTIME_IMAGE: ghcr.io/sagorain/agent-builder-runtime@sha256:sha256:439febdf6733abf65c96eeead9c854970714ad3a7f72372c1972f3a00e72031e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the agent image (runs agent-builder check and test)
        run: |
          docker build \
            --build-arg AGENT_BUILDER_RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            -t agent:${{ github.sha }} .
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: agent:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
